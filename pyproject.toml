[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellthreatmodel"
version = "0.1.0"
description = "CLI tool for automated STRIDE/DREAD threat modeling from architecture artifacts."
readme = "README.md"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "shellingham>=1.5.4",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
    "jinja2>=3.1.4",
    "rich>=13.7.0",
    "networkx>=3.2.1",
    "graphviz>=0.20.3",
    "openai>=1.37.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
    "fastapi>=0.112.0"
]

[project.optional-dependencies]
full = [
    "plantuml-parser>=0.3.0",
    "orjson>=3.10.6",
    "pyinstaller>=6.8.0"
]
dev = [
    "pytest>=8.0.0"
]

dynamic = ["classifiers"]

[project.scripts]
shellthreatmodel = "shellthreatmodel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shellthreatmodel = [
    "report/templates/*.j2"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
