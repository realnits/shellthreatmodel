[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellthreatmodel"
version = "0.1.0"
description = "CLI tool for automated STRIDE/DREAD threat modeling from architecture artifacts."
readme = "README.md"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.0.0",
    "typer>=0.7.0",
    "shellingham>=1.4.0",
    "pydantic>=1.10.0",
    "pyyaml>=5.4.0",
    "jsonschema>=4.0.0",
    "jinja2>=3.0.0",
    "rich>=12.0.0",
    "networkx>=3.0",
    "graphviz>=0.20.0",
    "openai>=1.0.0",
    "httpx>=0.23.0",
    "python-dotenv>=0.19.0",
    "uvicorn>=0.20.0",
    "fastapi>=0.100.0"
]

[project.optional-dependencies]
ocr = [
    "pillow>=10.0.0",
    "pytesseract>=0.3.10"
]
full = [
    "plantuml-parser>=0.3.0",
    "orjson>=3.10.6",
    "pyinstaller>=6.8.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10"
]
dev = [
    "pytest>=8.0.0"
]

dynamic = ["classifiers"]

[project.scripts]
shellthreatmodel = "shellthreatmodel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shellthreatmodel = [
    "report/templates/*.j2"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
